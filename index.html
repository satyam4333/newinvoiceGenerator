<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>JERVISH Business Suite — Free</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--brand:#2563eb;--brand2:#1d4ed8;--danger:#dc2626;--ok:#16a34a;--warn:#d97706;--shadow:0 8px 30px #1018280d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:#111827;color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;z-index:5}
.logo{font-size:20px;font-weight:800;padding:10px 12px 20px}.logo small{display:block;color:#9ca3af;font-size:11px;margin-top:3px;font-weight:500}
.nav button{width:100%;background:transparent;color:#d1d5db;text-align:left;padding:11px 13px;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.active{background:#1f2937;color:#fff}.nav .section{font-size:10px;color:#6b7280;padding:16px 13px 5px;text-transform:uppercase;letter-spacing:.08em}
.main{margin-left:245px;width:calc(100% - 245px)}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:4}
.page{padding:28px;max-width:1450px;margin:auto}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.title h1{margin:0;font-size:26px}.muted{color:var(--muted);font-size:13px}
.btn{padding:10px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:650}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.primary:hover{background:var(--brand2)}.btn.danger{color:#fff;background:var(--danger)}.btn.sm{padding:7px 10px;font-size:12px}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:26px;font-weight:800;margin-top:6px}.stat .sub{font-size:12px;color:var(--muted);margin-top:5px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.table th{color:var(--muted);font-weight:650;background:#fafafa}.actions{display:flex;gap:6px}
.form{display:grid;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:10px;background:#fff}.field textarea{min-height:80px;resize:vertical}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:14px;width:min(950px,100%);max-height:92vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:20px}
/* Invoice / quotation output — A4, matched to supplied reference */
.invoice{background:#fff;color:#333;width:190mm;min-height:277mm;margin:0 auto;padding:10mm 9mm 7mm;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.28;position:relative;box-sizing:border-box}
.invoice h2{margin:0}.invoiceLogo{position:absolute;top:9mm;right:9mm;width:42mm;max-height:29mm;object-fit:contain;object-position:right top}.invhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;min-height:32mm}.invhead>div:first-child{width:58%}.invhead .invmeta{width:42%;text-align:right;padding-right:0}.invhead .invmeta h2{font-size:24px;line-height:1.1;color:#6a3bc2;font-weight:500;margin:0 0 11px}.invhead .invmeta div{margin:4px 0}.invhead>div:first-child h2{font-size:0;height:20px}.invlabel{font-size:12px;font-weight:500;color:#6a3bc2;margin-bottom:5px}
.invhead .taxmode{display:none}.colorbar{display:none}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin:0 0 5mm}.partybox{background:#eee9f8;border:0;border-radius:6px;padding:5mm 4mm;min-height:41mm;color:#333}.partybox b{font-size:11.5px;display:block;margin-bottom:2px}.partybox div{margin:1px 0}.partybox .invlabel{font-size:16px;color:#6a3bc2;margin-bottom:4px;font-weight:500}
.invtable{width:100%;border-collapse:collapse;table-layout:fixed;margin:0;font-size:10.5px}.invtable th{background:#6a38c2;color:#fff;border:0;padding:3.2mm 1.5mm;text-align:center;font-weight:600;vertical-align:middle}.invtable td{border:1px solid #ddd;padding:2.7mm 1.6mm;vertical-align:top}.invtable th:nth-child(1){width:5%}.invtable th:nth-child(2){width:22%}.invtable th:nth-child(3){width:12%}.invtable th:nth-child(4){width:8%}.invtable th:nth-child(5){width:10%}.invtable th:nth-child(6){width:10%}.invtable th:nth-child(7){width:12%}.invtable th:nth-child(8){width:11%}.invtable th:nth-child(9),.invtable th:nth-child(10){width:11%}.invtable td:first-child{text-align:center}.invtable td:nth-child(3),.invtable td:nth-child(4),.invtable td:nth-child(5),.invtable td:nth-child(n+7){text-align:right}.invtable tbody tr:nth-child(even){background:#eee9f8}.unitline{display:block;margin-top:5px;color:#444}.itemname{display:block;white-space:normal;word-break:break-word}
.bankterms{display:grid;grid-template-columns:57% 43%;gap:0;margin-top:5mm;align-items:start}.bankbox{background:#eee9f8;border-radius:6px;padding:4mm 4mm;min-height:40mm;font-size:10.5px}.bankbox>b{display:block;color:#6a3bc2;font-size:16px;font-weight:500;margin-bottom:3px}.bankbox div{display:grid;grid-template-columns:32% 68%;margin:2px 0}.bankbox div:first-letter{}.totals{margin-left:auto;width:90%;margin-top:0;font-size:11px}.totals div{display:flex;justify-content:space-between;padding:2.3mm 0;border-bottom:0}.grand{font-weight:700;border-top:1.5px solid #555;border-bottom:1.5px solid #555;margin-top:2mm;padding:3mm 0!important;font-size:16px}.termsbox{border:0;padding:6mm 0 0;font-size:10.5px}.termsbox>b{display:block;color:#6a3bc2;font-size:16px;font-weight:500;margin-bottom:2mm}.termsbox p{margin:0;white-space:pre-line}.invoice .contactline{margin-top:10mm;text-align:center;font-size:10.5px}.invoice .docfooter{position:absolute;bottom:3mm;left:0;right:0;text-align:center;font-size:7px;color:#555}
@media(max-width:700px){.parties,.bankterms{grid-template-columns:1fr}.invoice{width:100%;min-height:0;padding:20px}.invoiceLogo{position:static;display:block;margin-left:auto;margin-bottom:8px}}
@media print{ @page{size:A4 portrait;margin:0} html,body{background:#fff!important}body{margin:0!important}.sidebar,.top,.no-print{display:none!important}.main{margin:0!important;width:100%!important}.page{padding:0!important;max-width:none!important}.invoice{width:210mm!important;min-height:297mm!important;margin:0!important;padding:10mm 10mm 7mm!important;box-shadow:none!important;border:0!important;page-break-after:always;overflow:hidden}.modal{position:static!important;display:block!important;background:#fff!important;padding:0!important}.modalbox{box-shadow:none!important;padding:0!important;max-height:none!important;width:auto!important}.modalhead{display:none!important}.invoice table{page-break-inside:auto}.invoice tr{page-break-inside:avoid;page-break-after:auto}.invoice thead{display:table-header-group}.invoiceLogo{position:absolute!important;top:9mm!important;right:10mm!important}.invoice *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}
.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2ff;color:#3730a3}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.red{background:#fee2e2;color:#991b1b}
.empty{text-align:center;color:var(--muted);padding:40px}.hidden{display:none!important}.search{max-width:280px}.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px}
.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:12px 16px;border-radius:9px;z-index:50;box-shadow:var(--shadow)}
@media(max-width:900px){.sidebar{width:68px}.logo{font-size:0}.logo:before{content:"JB";font-size:18px}.nav span,.nav .section{display:none}.nav button{text-align:center}.main{margin-left:68px;width:calc(100% - 68px)}.stats{grid-template-columns:repeat(2,1fr)}.formgrid,.two,.three{grid-template-columns:1fr}.page{padding:18px}.top{padding:0 15px}}
@media print{.sidebar,.top,.no-print{display:none!important}.main{margin:0;width:100%}.page{padding:0}.invoice{border:0;max-width:none}.modal{position:static;display:block!important;background:#fff;padding:0}.modalbox{box-shadow:none;padding:0;max-height:none}.modalhead{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">JERVISH Business Suite<small>Free self-hosted edition</small></div>
<div class="nav">
<div class="section">Workspace</div>
<button data-page="dashboard" class="active">▦ <span>Dashboard</span></button>
<button data-page="invoices">▤ <span>Invoices</span></button>
<button data-page="quotations">◫ <span>Quotations</span></button>
<button data-page="clients">♙ <span>Clients</span></button>
<button data-page="items">▧ <span>Items / Products</span></button>
<div class="section">Money</div>
<button data-page="payments">₹ <span>Payments</span></button>
<button data-page="expenses">↘ <span>Expenses / Purchases</span></button>
<div class="section">Business</div>
<button data-page="settings">⚙ <span>Business Settings</span></button>
<button data-page="backup">⇩ <span>Backup / Restore</span></button>
</div>
</aside>
<main class="main">
<header class="top"><strong id="topTitle">Dashboard</strong><div class="muted">Local-first • No subscription • Your data stays in this browser</div></header>
<section class="page" id="page"></section>
</main>
</div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY="jbsuite_v1";
const fresh={settings:{name:"Your Business",gstin:"",pan:"",address:"",phone:"",email:"",state:"Chhattisgarh",logo:"",accname:"",accno:"",ifsc:"",bank:"",acctype:"Current",terms:"1. Please quote invoice number when remitting funds.\n2. Goods once sold will not be taken back.\n3. All disputes subject to jurisdiction."},clients:[],items:[],invoices:[],quotations:[],payments:[],expenses:[]};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(fresh);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function id(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2200)}
function openModal(html){document.getElementById("modalbox").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

const pages={
dashboard(){const sales=db.invoices.reduce((a,x)=>a+(x.total||0),0), paid=db.payments.reduce((a,x)=>a+(x.amount||0),0), exp=db.expenses.reduce((a,x)=>a+(x.total||0),0), due=sales-paid;
return `<div class="title"><div><h1>Dashboard</h1><div class="muted">Your business at a glance</div></div><button class="btn primary" onclick="newInvoice()">+ Create Invoice</button></div>
<div class="grid stats"><div class="card stat"><div class="label">Total Sales</div><div class="value">${money(sales)}</div><div class="sub">${db.invoices.length} invoices</div></div><div class="card stat"><div class="label">Received</div><div class="value">${money(paid)}</div><div class="sub">Recorded payments</div></div><div class="card stat"><div class="label">Outstanding</div><div class="value">${money(Math.max(0,due))}</div><div class="sub">Sales less recorded payments</div></div><div class="card stat"><div class="label">Expenses</div><div class="value">${money(exp)}</div><div class="sub">${db.expenses.length} entries</div></div></div>
<div class="grid two" style="margin-top:16px"><div class="card"><h3>Recent invoices</h3>${listInvoices(5)}</div><div class="card"><h3>Quick actions</h3><div class="grid two"><button class="btn" onclick="newInvoice()">Create Invoice</button><button class="btn" onclick="newQuote()">Create Quotation</button><button class="btn" onclick="newClient()">Add Client</button><button class="btn" onclick="newExpense()">Add Expense</button></div></div></div>`},
invoices(){return `<div class="title"><div><h1>Invoices</h1><div class="muted">Create, print and manage invoices</div></div><button class="btn primary" onclick="newInvoice()">+ New Invoice</button></div><div class="card"><div class="tablewrap">${listInvoices()}</div></div>`},
quotations(){return `<div class="title"><div><h1>Quotations</h1><div class="muted">Prepare estimates and convert them into invoices</div></div><button class="btn primary" onclick="newQuote()">+ New Quotation</button></div><div class="card"><div class="tablewrap">${listQuotes()}</div></div>`},
clients(){return `<div class="title"><div><h1>Clients</h1><div class="muted">Customers and billing contacts</div></div><button class="btn primary" onclick="newClient()">+ Add Client</button></div><div class="card"><div class="tablewrap">${listClients()}</div></div>`},
items(){return `<div class="title"><div><h1>Items / Products</h1><div class="muted">Reusable products, HSN and tax rates</div></div><button class="btn primary" onclick="newItem()">+ Add Item</button></div><div class="card"><div class="tablewrap">${listItems()}</div></div>`},
payments(){return `<div class="title"><div><h1>Payments</h1><div class="muted">Record incoming payments</div></div><button class="btn primary" onclick="newPayment()">+ Record Payment</button></div><div class="card"><div class="tablewrap">${listPayments()}</div></div>`},
expenses(){return `<div class="title"><div><h1>Expenses / Purchases</h1><div class="muted">Track business costs and vendor bills</div></div><button class="btn primary" onclick="newExpense()">+ Add Expense</button></div><div class="card"><div class="tablewrap">${listExpenses()}</div></div>`},
settings(){let s=db.settings;return `<div class="title"><div><h1>Business Settings</h1><div class="muted">Billed By details, GST state, bank details and invoice terms</div></div><button class="btn primary" onclick="saveSettings()">Save</button></div><div class="card"><div class="form"><div class="formgrid"><div class="field"><label>Business name</label><input id="set_name" value="${esc(s.name)}"></div><div class="field"><label>GSTIN</label><input id="set_gstin" value="${esc(s.gstin)}"></div><div class="field"><label>PAN</label><input id="set_pan" value="${esc(s.pan||"")}"></div><div class="field"><label>Phone</label><input id="set_phone" value="${esc(s.phone)}"></div><div class="field"><label>Email</label><input id="set_email" value="${esc(s.email)}"></div><div class="field"><label>State *</label><input id="set_state" value="${esc(s.state)}" placeholder="e.g. Chhattisgarh"></div><div class="field"><label>Account Name</label><input id="set_accname" value="${esc(s.accname||s.name)}"></div><div class="field"><label>Account Number</label><input id="set_accno" value="${esc(s.accno||"")}"></div><div class="field"><label>IFSC</label><input id="set_ifsc" value="${esc(s.ifsc||"")}"></div><div class="field"><label>Bank</label><input id="set_bank" value="${esc(s.bank||"")}"></div><div class="field"><label>Account Type</label><input id="set_acctype" value="${esc(s.acctype||"Current")}"></div><div class="field"><label>Invoice Logo</label><input id="set_logo_file" type="file" accept="image/png,image/jpeg,image/webp"><div class="muted" style="margin-top:5px">Upload logo from your device. It is stored locally in this browser.</div>${s.logo?`<img src="${esc(s.logo)}" class="invoiceLogo" style="margin-top:8px">`:""}</div></div><div class="field"><label>Business address</label><textarea id="set_address">${esc(s.address)}</textarea></div><div class="field"><label>Invoice Terms & Conditions</label><textarea id="set_terms">${esc(s.terms||"1. Please quote invoice number when remitting funds.\n2. Goods once sold will not be taken back.\n3. All disputes subject to jurisdiction.")}</textarea></div></div></div>`},
backup(){return `<div class="title"><div><h1>Backup / Restore</h1><div class="muted">Export your entire business database or restore it later</div></div></div><div class="grid two"><div class="card"><h3>Export</h3><p class="muted">Download JSON containing clients, products, invoices, payments, expenses and settings.</p><button class="btn primary" onclick="exportDB()">Download Backup</button></div><div class="card"><h3>Restore</h3><p class="muted">Choose a backup JSON file. Existing local data will be replaced.</p><input type="file" id="restoreFile" accept=".json"><button class="btn" style="margin-top:10px" onclick="restoreDB()">Restore Backup</button></div></div>`}
};
function listInvoices(n){let a=[...db.invoices].reverse();if(n)a=a.slice(0,n);if(!a.length)return '<div class="empty">No invoices yet.</div>';return `<table class="table"><thead><tr><th>No.</th><th>Client</th><th>Date</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${a.map(x=>{let p=db.payments.filter(z=>z.invoiceId===x.id).reduce((q,z)=>q+z.amount,0);return `<tr><td>${esc(x.no)}</td><td>${esc(x.clientName)}</td><td>${x.date}</td><td>${money(x.total)}</td><td><span class="badge ${p>=x.total?'ok':p?'warn':'red'}">${p>=x.total?'Paid':p?'Partial':'Unpaid'}</span></td><td class="actions"><button class="btn sm" onclick="openPDF('invoice','${x.id}',false)">View</button><button class="btn sm" onclick="deleteRec('invoices','${x.id}')">Delete</button></td></tr>`}).join("")}</tbody></table>`}
function listQuotes(){if(!db.quotations.length)return '<div class="empty">No quotations yet.</div>';return `<table class="table"><thead><tr><th>No.</th><th>Client</th><th>Date</th><th>Total</th><th></th></tr></thead><tbody>${[...db.quotations].reverse().map(x=>`<tr><td>${x.no}</td><td>${esc(x.clientName)}</td><td>${x.date}</td><td>${money(x.total)}</td><td class="actions"><button class="btn sm" onclick="openPDF('quotation','${x.id}',false)">View</button><button class="btn sm" onclick="convertQuote('${x.id}')">Convert to Invoice</button><button class="btn sm" onclick="deleteRec('quotations','${x.id}')">Delete</button></td></tr>`).join("")}</tbody></table>`}
function listClients(){if(!db.clients.length)return '<div class="empty">No clients yet.</div>';return `<table class="table"><thead><tr><th>Party Name</th><th>State</th><th>Phone</th><th>GSTIN</th><th>PAN</th><th></th></tr></thead><tbody>${db.clients.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.state||"")}</td><td>${esc(x.phone)}</td><td>${esc(x.gstin)}</td><td>${esc(x.pan||"")}</td><td><button class="btn sm" onclick="deleteRec('clients','${x.id}')">Delete</button></td></tr>`).join("")}</tbody></table>`}
function listItems(){if(!db.items.length)return '<div class="empty">No products yet.</div>';return `<table class="table"><thead><tr><th>Item</th><th>HSN</th><th>Price</th><th>GST</th><th></th></tr></thead><tbody>${db.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.hsn)}</td><td>${money(x.price)}</td><td>${x.gst}%</td><td><button class="btn sm" onclick="deleteRec('items','${x.id}')">Delete</button></td></tr>`).join("")}</tbody></table>`}
function listPayments(){if(!db.payments.length)return '<div class="empty">No payments recorded.</div>';return `<table class="table"><thead><tr><th>Date</th><th>Invoice</th><th>Method</th><th>Amount</th><th></th></tr></thead><tbody>${[...db.payments].reverse().map(x=>`<tr><td>${x.date}</td><td>${esc((db.invoices.find(i=>i.id===x.invoiceId)||{}).no||"—")}</td><td>${esc(x.method)}</td><td>${money(x.amount)}</td><td><button class="btn sm" onclick="deleteRec('payments','${x.id}')">Delete</button></td></tr>`).join("")}</tbody></table>`}
function listExpenses(){if(!db.expenses.length)return '<div class="empty">No expenses yet.</div>';return `<table class="table"><thead><tr><th>Date</th><th>Vendor</th><th>Category</th><th>Total</th><th></th></tr></thead><tbody>${[...db.expenses].reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.vendor)}</td><td>${esc(x.category)}</td><td>${money(x.total)}</td><td><button class="btn sm" onclick="deleteRec('expenses','${x.id}')">Delete</button></td></tr>`).join("")}</tbody></table>`}

function clientOptions(){return '<option value="">Select client</option>'+db.clients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}
function itemOptions(){return '<option value="">Select item</option>'+db.items.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}
function lineRow(i=0){return `<tr class="line"><td><select class="li">${itemOptions()}</select></td><td><input class="qty" type="number" min="0" value="1"></td><td><select class="unit"><option>pcs</option><option>kg</option><option>g</option><option>set</option><option>box</option><option>meter</option><option>litre</option></select></td><td><input class="rate" type="number" min="0" value="0"></td><td><input class="gst" type="number" min="0" value="18"></td><td class="amt">0.00</td><td><button class="btn sm" onclick="this.closest('tr').remove();calcDoc()">×</button></td></tr>`}
function docForm(kind){
let title=kind==="invoice"?"New Invoice":"New Quotation", no=(kind==="invoice"?"INV-":"QUO-")+new Date().getFullYear()+"-"+String((kind==="invoice"?db.invoices.length:db.quotations.length)+1).padStart(4,"0");
openModal(`<div class="modalhead"><h2>${title}</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><div class="formgrid"><div class="field"><label>Document No.</label><input id="d_no" value="${no}"></div><div class="field"><label>Date</label><input id="d_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Client</label><select id="d_client" onchange="fillClient();updateTaxMode()">${clientOptions()}</select></div><div class="field"><label>Due Date</label><input id="d_due" type="date" value="${new Date(Date.now()+15*864e5).toISOString().slice(0,10)}"></div></div><div id="taxModeHint" class="taxmode">Select party to determine GST</div>
<div class="card"><h3>Items</h3><div class="tablewrap"><table class="table"><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Rate</th><th>GST %</th><th>Amount</th><th></th></tr></thead><tbody id="lines">${lineRow()}</tbody></table></div><button class="btn sm" onclick="document.getElementById('lines').insertAdjacentHTML('beforeend',lineRow());">+ Add line</button></div>
<div class="formgrid"><div class="field"><label>Notes</label><textarea id="d_notes" placeholder="Payment terms, bank details, etc."></textarea></div><div class="card"><div><b>Subtotal:</b> <span id="sub">₹0.00</span></div><div><b>GST:</b> <span id="tax">₹0.00</span></div><div style="font-size:20px;margin-top:10px"><b>Total:</b> <span id="grand">₹0.00</span></div></div></div>
<button class="btn primary" onclick="saveDoc('${kind}')">Save ${kind==="invoice"?"Invoice":"Quotation"}</button></div>`);
document.querySelectorAll(".li").forEach(s=>s.addEventListener("change",()=>{let it=db.items.find(x=>x.id===s.value);if(it){s.closest("tr").querySelector(".rate").value=it.price;s.closest("tr").querySelector(".gst").value=it.gst}calcDoc()}));
document.querySelectorAll(".qty,.rate,.gst").forEach(x=>x.addEventListener("input",calcDoc));calcDoc()
}
function fillClient(){let c=db.clients.find(x=>x.id===document.getElementById("d_client").value);if(c){toast("Party loaded from master list");}updateTaxMode()}
function updateTaxMode(){let c=db.clients.find(x=>x.id===document.getElementById("d_client").value);let ss=(db.settings.state||"").trim().toLowerCase(),bs=inferState(c);let same=ss&&bs&&ss===bs;let el=document.getElementById("taxModeHint");if(el)el.textContent=same?"INTRA-STATE: CGST + SGST":"INTER-STATE: IGST";}
function calcDoc(){let sub=0,tax=0;document.querySelectorAll("#lines .line").forEach(r=>{let q=+r.querySelector(".qty").value||0,rate=+r.querySelector(".rate").value||0,g=+r.querySelector(".gst").value||0,base=q*rate,t=base*g/100;sub+=base;tax+=t;r.querySelector(".amt").textContent=(base+t).toFixed(2)});document.getElementById("sub").textContent=money(sub);document.getElementById("tax").textContent=money(tax);document.getElementById("grand").textContent=money(sub+tax)}
function inferState(c){let s=(c?.state||"").trim().toLowerCase();if(s)return s;let a=(c?.address||"").toLowerCase();const states=["andhra pradesh","arunachal pradesh","assam","bihar","chhattisgarh","goa","gujarat","haryana","himachal pradesh","jharkhand","karnataka","kerala","madhya pradesh","maharashtra","odisha","punjab","rajasthan","sikkim","tamil nadu","telangana","uttar pradesh","uttarakhand","west bengal","delhi","chandigarh"];return states.find(x=>a.includes(x))||""}
function readDoc(){let c=db.clients.find(x=>x.id===document.getElementById("d_client").value);let sellerState=(db.settings.state||"").trim().toLowerCase(), buyerState=inferState(c);let intra=sellerState&&buyerState&&sellerState===buyerState;let lines=[...document.querySelectorAll("#lines .line")].map(r=>{let item=db.items.find(x=>x.id===r.querySelector(".li").value);let q=+r.querySelector(".qty").value||0,rate=+r.querySelector(".rate").value||0,g=+r.querySelector(".gst").value||0,base=q*rate,tax=base*g/100;return {name:item?.name||"Item",hsn:item?.hsn||"",qty:q,unit:r.querySelector(".unit")?.value||"pcs",rate,gst:g,base,tax,total:base+tax}});let sub=lines.reduce((a,x)=>a+x.base,0),tax=lines.reduce((a,x)=>a+x.tax,0);return {id:id("doc"),no:document.getElementById("d_no").value,date:document.getElementById("d_date").value,due:document.getElementById("d_due").value,clientId:c?.id||"",clientName:c?.name||"Walk-in Client",client:c||{},sellerState,buyerState,intraState:intra,lines,subtotal:sub,tax,cgst:intra?tax/2:0,sgst:intra?tax/2:0,igst:intra?0:tax,total:sub+tax,notes:document.getElementById("d_notes").value}}
function saveDoc(kind){let d=readDoc();db[kind==="invoice"?"invoices":"quotations"].push(d);save();closeModal();render();toast(kind==="invoice"?"Invoice saved":"Quotation saved")}
function viewInvoice(i){let x=db.invoices.find(z=>z.id===i);openModal(invoiceHTML(x,"Invoice"))}
function viewQuote(i){let x=db.quotations.find(z=>z.id===i);openModal(invoiceHTML(x,"Quotation"))}
function invoiceHTML(x,title){let s=db.settings,c=x.client||{},same=x.intraState;let docTitle=title==='Quotation'?'Quotation':'Sales Invoice';return `<div class="no-print" style="display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap"><button class="btn primary" onclick="openPDF('${title==='Quotation'?'quotation':'invoice'}','${x.id}',false)">View PDF</button><button class="btn" onclick="openPDF('${title==='Quotation'?'quotation':'invoice'}','${x.id}',true)">Download PDF</button><button class="btn" onclick="closeModal()">Close</button></div><div class="invoice">${s.logo?`<img src="${esc(s.logo)}" class="invoiceLogo">`:''}<div class="invhead"><div><h2>${esc(s.name)}</h2></div><div class="invmeta"><h2>${docTitle}</h2><div><b>Invoice No #</b> &nbsp; ${esc(x.no)}</div><div><b>Invoice Date</b> &nbsp; ${x.date}</div></div></div><div class="parties"><div class="partybox"><div class="invlabel">Billed By</div><b>${esc(s.name)}</b><div>${esc(s.address)}</div>${s.gstin?`<div>GSTIN: ${esc(s.gstin)}</div>`:''}${s.pan?`<div>PAN: ${esc(s.pan)}</div>`:''}</div><div class="partybox"><div class="invlabel">Billed To</div><b>${esc(c.name||x.clientName)}</b><div>${esc(c.address||'')}</div>${c.state?`<div>${esc(c.state)}</div>`:''}${c.gstin?`<div>GSTIN: ${esc(c.gstin)}</div>`:''}${c.pan?`<div>PAN: ${esc(c.pan)}</div>`:''}</div></div><table class="invtable"><thead><tr><th>#</th><th>Item</th><th>HSN/SAC</th><th>GST<br>Rate</th><th>Quantity</th><th>Rate</th><th>Amount</th>${same?'<th>CGST</th><th>SGST</th>':'<th>IGST</th><th>Tax</th>'}<th>Total</th></tr></thead><tbody>${x.lines.map((l,i)=>{let unit=l.unit||'pcs';return `<tr><td>${i+1}.</td><td><span class="itemname">${esc(l.name)}</span><span class="unitline">${esc(unit)}</span></td><td>${esc(l.hsn||'')}</td><td>${l.gst}%</td><td>${Number(l.qty).toLocaleString('en-IN')} ${esc(unit)}</td><td>${money(l.rate)}</td><td>${money(l.base)}</td>${same?`<td>${money(l.tax/2)}</td><td>${money(l.tax/2)}</td>`:`<td>${money(l.tax)}</td><td>${money(l.tax)}</td>`}<td>${money(l.total)}</td></tr>`}).join('')}</tbody></table><div class="bankterms"><div class="bankbox"><b>Bank Details</b><div><span>Account Name</span><span>${esc(s.accname||s.name)}</span></div><div><span>Account Number</span><span>${esc(s.accno||'')}</span></div><div><span>IFSC</span><span>${esc(s.ifsc||'')}</span></div><div><span>Account Type</span><span>${esc(s.acctype||'')}</span></div><div><span>Bank</span><span>${esc(s.bank||'')}</span></div></div><div><div class="totals"><div><span>Amount</span><span>${money(x.subtotal)}</span></div>${same?`<div><span>CGST</span><span>${money(x.cgst)}</span></div><div><span>SGST</span><span>${money(x.sgst)}</span></div>`:`<div><span>IGST</span><span>${money(x.igst)}</span></div>`}<div><span>Round Up</span><span>${money(Math.round(x.total)-x.total)}</span></div><div class="grand"><span>Total (INR)</span><span>${money(Math.round(x.total))}</span></div></div></div></div><div class="termsbox"><b>Terms and Conditions</b><p>${esc(s.terms||x.notes||'')}</p></div><div class="contactline">For any enquiry, reach out via email at <b>${esc(s.email||'')}</b>${s.phone?`, call on <b>${esc(s.phone)}</b>`:''}</div><div class="docfooter">This is an electronically generated document, no signature is required.</div></div>`}

function newInvoice(){docForm("invoice")}function newQuote(){docForm("quotation")}
function newClient(){openModal(`<div class="modalhead"><h2>Add Party / Client</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><div class="formgrid"><div class="field"><label>Party Name *</label><input id="c_name"></div><div class="field"><label>State *</label><input id="c_state" placeholder="e.g. Gujarat"></div><div class="field"><label>Phone</label><input id="c_phone"></div><div class="field"><label>Email</label><input id="c_email"></div><div class="field"><label>GSTIN</label><input id="c_gstin"></div><div class="field"><label>PAN</label><input id="c_pan"></div></div><div class="field"><label>Complete Party Address</label><textarea id="c_address" placeholder="Full billing/shipping address"></textarea></div><button class="btn primary" onclick="saveClient()">Save Party to Master</button></div>`)}
function saveClient(){let name=document.getElementById("c_name").value.trim();if(!name)return toast("Party name required");let state=document.getElementById("c_state").value.trim();db.clients.push({id:id("c"),name,state,phone:c_phone.value,email:c_email.value,gstin:c_gstin.value,pan:c_pan.value,address:c_address.value});save();closeModal();render();toast("Party added to master list")}
function newItem(){openModal(`<div class="modalhead"><h2>Add Item</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><div class="formgrid"><div class="field"><label>Item name *</label><input id="i_name"></div><div class="field"><label>HSN/SAC</label><input id="i_hsn"></div><div class="field"><label>Price</label><input id="i_price" type="number"></div><div class="field"><label>GST %</label><input id="i_gst" type="number" value="18"></div></div><button class="btn primary" onclick="saveItem()">Save Item</button></div>`)}
function saveItem(){let name=i_name.value.trim();if(!name)return toast("Item name required");db.items.push({id:id("i"),name,hsn:i_hsn.value,price:+i_price.value||0,gst:+i_gst.value||0});save();closeModal();render();toast("Item added")}
function newPayment(){openModal(`<div class="modalhead"><h2>Record Payment</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><div class="formgrid"><div class="field"><label>Invoice</label><select id="p_inv">${db.invoices.map(x=>`<option value="${x.id}">${x.no} — ${esc(x.clientName)}</option>`).join("")}</select></div><div class="field"><label>Date</label><input id="p_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Amount</label><input id="p_amount" type="number"></div><div class="field"><label>Method</label><select id="p_method"><option>UPI</option><option>Bank Transfer</option><option>Cash</option><option>Card</option><option>Cheque</option></select></div></div><button class="btn primary" onclick="savePayment()">Save Payment</button></div>`)}
function savePayment(){if(!p_inv.value)return toast("Create an invoice first");db.payments.push({id:id("p"),invoiceId:p_inv.value,date:p_date.value,amount:+p_amount.value||0,method:p_method.value});save();closeModal();render();toast("Payment recorded")}
function newExpense(){openModal(`<div class="modalhead"><h2>Add Expense / Purchase</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><div class="formgrid"><div class="field"><label>Date</label><input id="e_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Vendor</label><input id="e_vendor"></div><div class="field"><label>Category</label><input id="e_category" placeholder="Transport, Purchase, Office..."></div><div class="field"><label>Total</label><input id="e_total" type="number"></div></div><div class="field"><label>Notes</label><textarea id="e_notes"></textarea></div><button class="btn primary" onclick="saveExpense()">Save Expense</button></div>`)}
function saveExpense(){db.expenses.push({id:id("e"),date:e_date.value,vendor:e_vendor.value,category:e_category.value,total:+e_total.value||0,notes:e_notes.value});save();closeModal();render();toast("Expense added")}
function convertQuote(qid){let q=db.quotations.find(x=>x.id===qid);if(!q)return;let inv={...q,id:id("doc"),no:"INV-"+new Date().getFullYear()+"-"+String(db.invoices.length+1).padStart(4,"0")};db.invoices.push(inv);save();render();toast("Quotation converted to invoice")}
function deleteRec(k,i){if(confirm("Delete this record?")){db[k]=db[k].filter(x=>x.id!==i);save();render();}}
async function saveSettings(){let logo=db.settings.logo;let f=document.getElementById("set_logo_file")?.files?.[0];if(f) logo=await fileToDataURL(f);db.settings={...db.settings,name:set_name.value,gstin:set_gstin.value,pan:set_pan.value,phone:set_phone.value,email:set_email.value,state:set_state.value,logo,address:set_address.value,accname:set_accname.value,accno:set_accno.value,ifsc:set_ifsc.value,bank:set_bank.value,acctype:set_acctype.value,terms:set_terms.value};save();render();toast("Business settings saved")}
function fileToDataURL(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function exportDB(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jervish-business-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href)}
function restoreDB(){let f=document.getElementById("restoreFile").files[0];if(!f)return toast("Choose a JSON backup");let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!Array.isArray(x.invoices))throw 0;db=x;save();render();toast("Backup restored")}catch(e){toast("Invalid backup file")}};r.readAsText(f)}
async function openPDF(kind,i,download=false){
  const list=kind==='quotation'?db.quotations:db.invoices;
  const x=list.find(z=>z.id===i);
  if(!x)return toast('Document not found');
  let popup=null;
  if(!download) popup=window.open('about:blank','_blank');
  try{
    const r=await fetch('/api/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document:x,settings:db.settings,kind})});
    if(!r.ok) throw new Error('PDF server not available');
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const filename=(x.no|| (kind==='quotation'?'Quotation':'Sales-Invoice'))+'.pdf';
    if(download){
      const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),30000);toast('PDF downloaded');
    }else if(popup && !popup.closed){
      popup.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),30000);
    }else{
      const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);
    }
  }catch(e){if(popup&&!popup.closed)popup.close();toast('PDF download ke liye app ko Node server se run karein');console.error(e)}
}
function printInvoicePDF(i){return openPDF('invoice',i,true)}

function render(page=location.hash.slice(1)||"dashboard"){if(!pages[page])page="dashboard";document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("topTitle").textContent=page[0].toUpperCase()+page.slice(1);document.getElementById("page").innerHTML=pages[page]()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.page;render(b.dataset.page)});
window.addEventListener("hashchange",()=>render());
render();
</script>
